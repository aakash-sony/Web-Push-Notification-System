spring.application.name=webpush

# Production Database Configuration via Environment Variables
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Admin Configuration via Environment Variables
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD}

# Production CORS Configuration (Frontend URL e.g. https://myfrontend.com)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Session Cookie Configuration for Production (Cross-Origin HTTPS support)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=none
server.servlet.session.cookie.max-age=604800

# Firebase credentials path in production (e.g. /etc/secrets/firebase.json)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# SQL Initialization for ShedLock and Custom Schemas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
