spring.application.name=webpush
server.port=${PORT:8080}

# Default / Dev Profile
spring.profiles.default=dev

# Database Configuration (Dev defaults)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/webpush}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:root}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Admin Configuration
admin.username=${ADMIN_USERNAME:admin}
admin.password=${ADMIN_PASSWORD:admin123}

# CORS Configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Session Cookie Configuration (Dev)
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.max-age=604800

# Optional external Firebase credentials path (blank uses classpath fallback)
firebase.credentials.path=${FIREBASE_CREDENTIALS_PATH:}

# SQL Initialization for ShedLock and Custom Schemas
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true
